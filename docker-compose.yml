services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    # Local development values only; set real secrets for any deployment.
    environment:
      SECRET_KEY: dev-only-insecure-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
